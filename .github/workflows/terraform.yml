name: Terraform AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TF_VAR_subnet_id: ${{ secrets.TF_VAR_subnet_id }}
  TF_VAR_vpc_security_group_id: ${{ secrets.TF_VAR_vpc_security_group_id }}
  TF_VAR_aws_region: ${{ secrets.TF_VAR_aws_region }}
  TF_INPUT: false

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::676206917781:role/GitHub_test_role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var="aws_region=us-east-1"

  apply:
    name: Terraform Apply
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: plan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::676206917781:role/GitHub_test_role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -reconfigure

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="aws_region=us-east-1"
